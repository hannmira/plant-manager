<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화분 관리</title>
    <style>
        body { 
            font-family: sans-serif; 
            max-width: 300px; 
            margin: 20px auto; 
            padding: 0 20px; 
            background: #f9f9f9; 
            color: #333; 
        }
        
        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
        }

        h1 { 
            font-size: 1.1rem; 
            margin: 0; 
            text-align: center; 
        }
        
        /* 레이아웃 밀림 방지를 위해 화면 우측 하단에 고정 표시 */
        #loading { 
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        
        .plant-item { 
            background: #fff; 
            padding: 6px 10px; 
            margin-bottom: 5px; 
            border-radius: 6px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .plant-name { 
            font-weight: bold; 
            font-size: 0.9rem; 
        }
        
        .plant-right {
            display: flex;
            align-items: center;
            gap: 8px; 
        }

        .plant-days { 
            color: #666; 
            font-size: 0.8rem; 
        }
        
        button { 
            background: #D1E7C8; 
            color: white; 
            border: none; 
            padding: 4px 8px; 
            font-size: 0.8rem; 
            border-radius: 4px; 
            cursor: pointer; 
            white-space: nowrap;
        }
        button:hover { background: #BDDDB1; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🌱 화분 물 주기</h1>
    </div>

    <!-- 고정 포지션으로 위치가 밀리지 않음 -->
    <div id="loading">데이터 로딩 중...</div>
    <div id="plant-list"></div>

    <script>
        const GITHUB_USER = "hannmira";
        const REPO_NAME = "plant-manager";
        const FILE_PATH = "plants.json";
        
        let token = localStorage.getItem('gh_token');
        if (!token) {
            token = prompt("GitHub Personal Access Token을 입력하세요 (최초 1회):");
            if (token) localStorage.setItem('gh_token', token.trim());
        }

        let plants = [];
        let fileSha = "";

        async function loadData() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { Authorization: `token ${token}` }
                });
                if (!res.ok) throw new Error('데이터 로드 실패');
                
                const data = await res.json();
                fileSha = data.sha;
                plants = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                
                document.getElementById('loading').style.display = 'none';
                render();
            } catch (err) {
                document.getElementById('loading').innerText = `오류: ${err.message}`;
            }
        }

        function render() {
            const listDiv = document.getElementById('plant-list');
            listDiv.innerHTML = '';
        
            plants.forEach((plant, index) => {
                const daysAgo = calculateDaysAgo(plant.lastWatered);
                const daysText = daysAgo === 0 ? '오늘' : `${daysAgo}일 전`;
                
                const item = document.createElement('div');
                item.className = 'plant-item';
                item.innerHTML = `
                    <div class="plant-name">${plant.name}</div>
                    <div class="plant-right">
                        <span class="plant-days">${daysText}</span>
                        <button onclick="waterPlant(${index})">💧</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        function formatJsonOneLinePerPlant(arr) {
            const items = arr.map(p => JSON.stringify(p));
            return "[\n  " + items.join(",\n  ") + "\n]";
        }

        async function waterPlant(index) {
            const today = new Date().toISOString().split('T')[0];
            
            plants[index].lastWatered = today;
        
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = '저장 중...';
        
            try {
                const formattedJson = formatJsonOneLinePerPlant(plants);
                const updatedContent = btoa(unescape(encodeURIComponent(formattedJson)));
                
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Watered plant index ${index}`,
                        content: updatedContent,
                        sha: fileSha
                    })
                });

                if (!res.ok) throw new Error('저장 실패');
        
                const resData = await res.json();
                fileSha = resData.content.sha;
                
                document.getElementById('loading').style.display = 'none';
                render();
            } catch (err) {
                alert(`오류: ${err.message}`);
                document.getElementById('loading').style.display = 'none';
            }
        }

        function calculateDaysAgo(dateString) {
            const last = new Date(dateString);
            const today = new Date();
            today.setHours(0,0,0,0);
            last.setHours(0,0,0,0);
            return Math.floor((today - last) / (1000 * 60 * 60 * 24));
        }

        loadData();
    </script>
</body>
</html>
