<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화분 관리</title>
    <style>
        body { 
            font-family: sans-serif; 
            max-width: 270px; 
            margin: 16px auto; 
            padding: 0 10px; 
            background: #F8F9FA; 
            color: #212529; 
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.05rem; font-weight: bold; margin: 0; color: #0F172A; }
        
        #loading { 
            font-size: 0.7rem;
            color: #94A3B8;
            visibility: visible; 
            white-space: nowrap;
        }
        
        /* 화분 카드 레이아웃 */
        .plant-item { 
            background: #FFFFFF; 
            padding: 6px 10px; 
            margin-bottom: 6px; 
            border-radius: 8px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.03); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid #F1F5F9;
        }
        
        .plant-name { 
            font-weight: bold; 
            font-size: 0.85rem; 
            color: #334155;
        }
        
        .plant-right {
            display: flex;
            align-items: center;
            gap: 6px; 
        }

        /* 알약 모양 뱃지 */
        .plant-days { 
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 999px;
            transition: all 0.2s ease;
            letter-spacing: -0.2px;
            display: inline-block;
        }
        
        /* 원형 물방울 버튼 */
        button { 
            background: #E0F2FE; 
            color: #0284C7; 
            border: none; 
            width: 26px; 
            height: 26px; 
            border-radius: 50%; 
            font-size: 0.78rem; 
            cursor: pointer; 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
        }
        
        button:hover { 
            background: #BAE6FD; 
            transform: scale(1.08);
        }
        
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🌱 화분 물 주기</h1>
        <span id="loading">데이터 로딩 중...</span>
    </div>

    <div id="plant-list"></div>

    <script>
        const GITHUB_USER = "hannmira";
        const REPO_NAME = "plant-manager";
        const FILE_PATH = "plants.json";
        
        let token = localStorage.getItem('gh_token');
        if (!token) {
            token = prompt("GitHub Personal Access Token을 입력하세요 (최초 1회):");
            if (token) localStorage.setItem('gh_token', token.trim());
        }

        let plants = [];
        let fileSha = "";

        function showLoading(text) {
            const loadingEl = document.getElementById('loading');
            loadingEl.innerText = text;
            loadingEl.style.visibility = 'visible';
        }

        function hideLoading() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.visibility = 'hidden';
        }

        async function loadData() {
            try {
                showLoading('데이터 로딩 중...');
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { Authorization: `token ${token}` }
                });
                if (!res.ok) throw new Error('로드 실패');
                
                const data = await res.json();
                fileSha = data.sha;
                plants = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                
                hideLoading();
                render();
            } catch (err) {
                showLoading(`오류: ${err.message}`);
            }
        }

        function getDynamicColor(days) {
            const maxDays = 14; 
            const ratio = Math.min(days / maxDays, 1);
            const hue = Math.round(130 * (1 - ratio));

            const bg = `hsl(${hue}, 80%, 93%)`;
            const color = `hsl(${hue}, 70%, 30%)`;

            return { bg, color };
        }

        function render() {
            const listDiv = document.getElementById('plant-list');
            listDiv.innerHTML = '';
        
            plants.forEach((plant, index) => {
                const daysAgo = calculateDaysAgo(plant.lastWatered);
                const daysText = daysAgo === 0 ? '오늘' : `${daysAgo}일 전`;
                const style = getDynamicColor(daysAgo);

                const item = document.createElement('div');
                item.className = 'plant-item';
                item.innerHTML = `
                    <div class="plant-name">${plant.name}</div>
                    <div class="plant-right">
                        <span class="plant-days" style="background-color: ${style.bg}; color: ${style.color};">
                            ${daysText}
                        </span>
                        <button onclick="waterPlant(${index})" title="오늘 물 주기">💧</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        function formatJsonOneLinePerPlant(arr) {
            const items = arr.map(p => JSON.stringify(p));
            return "[\n  " + items.join(",\n  ") + "\n]";
        }

        async function waterPlant(index) {
            const today = new Date().toISOString().split('T')[0];
            plants[index].lastWatered = today;
        
            showLoading('저장 중...');
        
            try {
                const formattedJson = formatJsonOneLinePerPlant(plants);
                const updatedContent = btoa(unescape(encodeURIComponent(formattedJson)));
                
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Watered plant index ${index}`,
                        content: updatedContent,
                        sha: fileSha
                    })
                });

                if (!res.ok) throw new Error('저장 실패');
        
                const resData = await res.json();
                fileSha = resData.content.sha;
                
                hideLoading();
                render();
            } catch (err) {
                alert(`오류: ${err.message}`);
                hideLoading();
            }
        }

        function calculateDaysAgo(dateString) {
            const last = new Date(dateString);
            const today = new Date();
            today.setHours(0,0,0,0);
            last.setHours(0,0,0,0);
            return Math.floor((today - last) / (1000 * 60 * 60 * 24));
        }

        loadData();
    </script>
</body>
</html>
