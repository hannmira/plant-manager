<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화분 관리</title>
    <style>
        body { 
            font-family: sans-serif; 
            max-width: 300px; 
            margin: 20px auto; 
            padding: 0 20px; 
            background: #f9f9f9; 
            color: #333; 
        }
        
        .header-container {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        h1 { font-size: 1.1rem; margin: 0; }
        
        #loading { 
            font-size: 0.75rem;
            color: #999;
            font-weight: normal;
            visibility: visible; 
            white-space: nowrap;
        }
        
        .plant-item { 
            background: #fff; 
            padding: 6px 10px; 
            margin-bottom: 5px; 
            border-radius: 6px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .plant-name { 
            font-weight: bold; 
            font-size: 0.9rem; 
        }
        
        .plant-right {
            display: flex;
            align-items: center;
            gap: 8px; 
        }

        /* 날짜 시각화 동적 뱃지 */
        .plant-days { 
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        button { 
            background: #D1E7C8; 
            color: white; 
            border: none; 
            padding: 4px 8px; 
            font-size: 0.8rem; 
            border-radius: 4px; 
            cursor: pointer; 
            white-space: nowrap;
        }
        button:hover { background: #BDDDB1; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🌱 화분 물 주기</h1>
        <span id="loading">데이터 로딩 중...</span>
    </div>

    <div id="plant-list"></div>

    <script>
        const GITHUB_USER = "hannmira";
        const REPO_NAME = "plant-manager";
        const FILE_PATH = "plants.json";
        
        let token = localStorage.getItem('gh_token');
        if (!token) {
            token = prompt("GitHub Personal Access Token을 입력하세요 (최초 1회):");
            if (token) localStorage.setItem('gh_token', token.trim());
        }

        let plants = [];
        let fileSha = "";

        function showLoading(text) {
            const loadingEl = document.getElementById('loading');
            loadingEl.innerText = text;
            loadingEl.style.visibility = 'visible';
        }

        function hideLoading() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.visibility = 'hidden';
        }

        async function loadData() {
            try {
                showLoading('데이터 로딩 중...');
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { Authorization: `token ${token}` }
                });
                if (!res.ok) throw new Error('로드 실패');
                
                const data = await res.json();
                fileSha = data.sha;
                plants = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                
                hideLoading();
                render();
            } catch (err) {
                showLoading(`오류: ${err.message}`);
            }
        }

        /**
         * 경과 일수(days)에 따른 점진적 HSL 색상 추출 함수
         * @param {number} days - 물 준 지 지난 일수
         * @returns {object} { bg: 배경색, color: 글자색 }
         */
        function getDynamicColor(days) {
            const maxDays = 14; // 색상이 완전히 빨간색이 되는 기준 일수
            
            // 120(초록) ~ 0(빨강) 사이값 계산
            const ratio = Math.min(days / maxDays, 1);
            const hue = Math.round(120 * (1 - ratio)); 

            // 배경은 파스텔 톤(채도 70%, 명도 90%), 글자색은 가독성 좋은 어두운 톤(채도 80%, 명도 25%)
            const bg = `hsl(${hue}, 70%, 90%)`;
            const color = `hsl(${hue}, 80%, 25%)`;

            return { bg, color };
        }

        function render() {
            const listDiv = document.getElementById('plant-list');
            listDiv.innerHTML = '';
        
            plants.forEach((plant, index) => {
                const daysAgo = calculateDaysAgo(plant.lastWatered);
                const daysText = daysAgo === 0 ? '오늘' : `${daysAgo}일 전`;
                
                // 점진적 HSL 색상 계산
                const style = getDynamicColor(daysAgo);

                const item = document.createElement('div');
                item.className = 'plant-item';
                item.innerHTML = `
                    <div class="plant-name">${plant.name}</div>
                    <div class="plant-right">
                        <span class="plant-days" style="background-color: ${style.bg}; color: ${style.color};">
                            ${daysText}
                        </span>
                        <button onclick="waterPlant(${index})">💧</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        }

        function formatJsonOneLinePerPlant(arr) {
            const items = arr.map(p => JSON.stringify(p));
            return "[\n  " + items.join(",\n  ") + "\n]";
        }

        async function waterPlant(index) {
            const today = new Date().toISOString().split('T')[0];
            plants[index].lastWatered = today;
        
            showLoading('저장 중...');
        
            try {
                const formattedJson = formatJsonOneLinePerPlant(plants);
                const updatedContent = btoa(unescape(encodeURIComponent(formattedJson)));
                
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Watered plant index ${index}`,
                        content: updatedContent,
                        sha: fileSha
                    })
                });

                if (!res.ok) throw new Error('저장 실패');
        
                const resData = await res.json();
                fileSha = resData.content.sha;
                
                hideLoading();
                render();
            } catch (err) {
                alert(`오류: ${err.message}`);
                hideLoading();
            }
        }

        function calculateDaysAgo(dateString) {
            const last = new Date(dateString);
            const today = new Date();
            today.setHours(0,0,0,0);
            last.setHours(0,0,0,0);
            return Math.floor((today - last) / (1000 * 60 * 60 * 24));
        }

        loadData();
    </script>
</body>
</html>
